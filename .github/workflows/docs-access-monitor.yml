name: Docs Access Monitor

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify-mintlify-jwt-gate:
    name: verify Mintlify JWT gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout docs repository
        uses: actions/checkout@v5

      - name: Verify docs access gate
        run: scripts/verify-docs-access.sh
